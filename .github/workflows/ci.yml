name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: {}

# Teaching material rather than a published package: there is no test suite, so
# CI verifies that dependencies install and every source file parses.
jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Syntax-check sources
        run: |
          found=0
          while IFS= read -r f; do
            node --check "$f"
            found=$((found+1))
          done < <(find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*')
          echo "checked $found files"
          [ "$found" -gt 0 ]
